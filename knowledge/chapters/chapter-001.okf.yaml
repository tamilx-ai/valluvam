content:
  summary:
    language: "en"
    text: >-
      This chapter opens the Thirukkural by expressing reverence
      for the divine and exploring the relationship between the
      divine, knowledge, human conduct, and spiritual well-being.
      Across its ten couplets, it reflects on the qualities
      associated with the divine and the significance of devotion,
      moral discernment, freedom from attachment, and the path
      towards enduring well-being.

  summary_ta:
    language: "ta"
    text: >-
      திருக்குறளின் தொடக்க அதிகாரமான கடவுள் வாழ்த்து,
      இறைவனைப் போற்றுவதுடன், இறைவனின் இயல்புகள், அறிவு,
      அறநெறி, பற்றின்மை மற்றும் வாழ்வின் உயர்ந்த நலன்
      ஆகியவற்றுக்கிடையேயான தொடர்புகளைப் பத்து குறள்களின்
      வழியாக எடுத்துரைக்கிறது.

