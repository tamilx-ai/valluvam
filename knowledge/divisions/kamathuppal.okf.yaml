content:
  summary:
    language: "en"
    text: >-
      Kamathuppal explores the emotional and relational dimensions
      of love between lovers. Through poetic expressions of
      attraction, affection, emotional intimacy, longing,
      separation, anticipation, and reunion, it portrays the
      inner experiences of love and the changing emotions that
      accompany relationships. The division presents love through
      the perspectives and feelings of those involved, emphasizing
      emotional depth, mutual attachment, and the subtleties of
      human experience.

  summary_ta:
    language: "ta"
    text: >-
      காமத்துப்பால் காதலர்களுக்கிடையேயான அன்பு, காதல்,
      உணர்வுப் பிணைப்பு மற்றும் உள்ளார்ந்த அனுபவங்களை
      எடுத்துரைக்கிறது. காதலின் தோற்றம், ஈர்ப்பு, கூடல்,
      பிரிவு, பிரிவாற்றாமை, ஏக்கம் மற்றும் மீண்டும்
      கூடுவதற்கான எதிர்பார்ப்பு போன்ற உணர்வுகளைப்
      பாடல்களின் வழியாக வெளிப்படுத்துகிறது. காதலர்களின்
      மனநிலைகள் மற்றும் உறவுகளில் ஏற்படும் உணர்வு
      மாற்றங்களை நுட்பமாகச் சித்தரிக்கிறது.

