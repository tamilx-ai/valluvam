content:
  summary:
    language: "en"
    text: >-
      Arathuppal explores the principles of virtuous living,
      moral responsibility, personal discipline, compassion,
      and ethical relationships. It presents virtue as a
      foundation for individual conduct and harmonious life,
      encompassing both personal integrity and responsibilities
      towards others.

  summary_ta:
    language: "ta"
    text: >-
      அறத்துப்பால் மனித வாழ்வின் அறநெறிகள், ஒழுக்கம்,
      அன்பு, அருள், கடமை மற்றும் பிறருடன் இணக்கமாக
      வாழ்வதற்கான பண்புகளை எடுத்துரைக்கிறது.
      தனிமனித வாழ்விலும் சமூக உறவுகளிலும் அறத்தின்
      முக்கியத்துவத்தை விளக்குகிறது.

