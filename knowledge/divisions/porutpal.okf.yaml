content:
  summary:
    language: "en"
    text: >-
      Porutpal explores the principles governing public life,
      leadership, administration, justice, economic prosperity,
      social relationships, and responsible action. Across its
      chapters, it examines the qualities of effective rulers
      and advisers, the responsibilities of institutions,
      the importance of wise decision-making, and the conduct
      required for individuals and communities to flourish.
      Wealth and power are considered in the context of
      ethical leadership, social order, and collective well-being.

  summary_ta:
    language: "ta"
    text: >-
      பொருட்பால் ஆட்சி, தலைமைத்துவம், நிர்வாகம், நீதி,
      பொருளாதாரம், நட்பு, சமூக உறவுகள் மற்றும் பொறுப்பான
      செயல்பாடு ஆகியவற்றை எடுத்துரைக்கிறது. நல்லாட்சி,
      அறிவார்ந்த முடிவெடுத்தல், அரசியல் மற்றும் சமூக
      ஒழுங்கு, பொருள் ஈட்டுதல் மற்றும் அதன் பயன்பாடு
      ஆகியவற்றின் வழியாக தனிமனித மற்றும் சமூக
      நலனுக்கான வழிமுறைகளை விளக்குகிறது.

