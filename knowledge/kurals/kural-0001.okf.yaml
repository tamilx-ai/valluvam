  chapter:
    id: "thirukkural.chapter.001"
    number: 1
    tamil: "கடவுள் வாழ்த்து"
    english: "The Praise of God"
  author: "திருவள்ளுவர்"

content:
  original:
    language: "ta"
    script: "Tamil"
    lines:
      - "அகர முதல எழுத்தெல்லாம், ஆதி"
      - "பகவன் முதற்றே உலகு."
    full_text: "அகர முதல எழுத்தெல்லாம், ஆதி பகவன் முதற்றே உலகு."

  transliteration:
    scheme: "informal_tanglish"
    text: "Agara mudhala ezhuththellaam aadhi bhagavan mudhatre ulagu."

  translations:
    - language: "en"
      type: "meaning"
      text: "As the letter A is first among all letters, so is the Eternal God first in the world."
      attribution: "Valluvam working translation"
      status: "draft"

  explanations:
    - language: "en"
      type: "plain_language"
      text: "Just as the letter A is the starting point of written language, the divine or ultimate first principle is presented as the beginning of the world."
      status: "draft"

    - language: "ta"
      type: "plain_language"
      text: "எழுத்துகளுக்கு அகரம் முதலாக இருப்பதுபோல், உலகிற்கு ஆதிபகவன் முதன்மையானவராகக் கூறப்படுகிறார்."
      status: "draft"

